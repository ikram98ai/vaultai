[package]
name = "vaultai"
version = "0.1.0"
description = "VaultAI is the ultimate self-contained AI chatbot: enjoy uncensored, unlimited use with no token limits, zero AI watermarks, and 100% personalized responses"
authors = ["ikram98ai"]
edition = "2024"

[lib]
name = "vaultai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.37.2"
chrono = "0.4.43"
anyhow = "1.0.100"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = "0.22.2"
hf-hub = "0.4.3"

